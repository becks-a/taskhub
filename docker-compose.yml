services:

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"  
    restart: unless-stopped  

  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/kybern-taskhub   
    restart: unless-stopped
  
  mongodb:
    image: mongo:8
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped  


volumes:
  mongodb_data:      